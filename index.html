<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOL Health Advocates</title>
    <style>
      :root {
        --bg: #f4f3f1;
        --ink: #2c4b52;
        --muted: #6b8a8d;
        --gold: #f0c978;
        --sea: #9dbac0;
        --sea-deep: #587a86;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
      }

      .wrap {
        width: min(92vw, 980px);
        text-align: center;
        padding: 2rem 1rem 3rem;
      }

      .logo {
        display: block;
        width: min(85vw, 760px);
        margin: 0 auto 1.5rem;
      }

      .tagline {
        margin-top: 1.4rem;
        font-size: clamp(2rem, 4vw, 3.8rem);
        font-weight: 400;
        color: var(--ink);
        letter-spacing: 0.02em;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <img class="logo" src="IMG_1998.png" alt="SOL Health Advocates logo" />
      <div class="tagline">Guidance. Understanding. Peace of mind.</div>
    </main>
  </body>
</html>
